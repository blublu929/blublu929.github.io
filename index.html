<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blu - 展示页面</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: rgba(255, 255, 255, 0.08);
      --line: rgba(255, 255, 255, 0.16);
      --text: #f8fafc;
      --muted: rgba(248, 250, 252, 0.68);
      --accent: #24d6b5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 18%, rgba(36, 214, 181, 0.18), transparent 30%),
        radial-gradient(circle at 82% 30%, rgba(89, 130, 246, 0.16), transparent 28%),
        linear-gradient(135deg, #080b16, var(--bg));
    }

    main {
      width: min(720px, calc(100vw - 40px));
      padding: 40px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(18px);
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(32px, 6vw, 56px);
      line-height: 1;
    }

    p {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid rgba(36, 214, 181, 0.5);
      border-radius: 999px;
      color: #05140f;
      background: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Blu</h1>
    <p>这里会逐步整理成个人网站。当前绚星平台产品迭代与AI能力升级说明展示页面已放在 /showai/ 路径下。</p>
    <a href="/showai/">打开 ShowAI 展示页</a>
  </main>
</body>
</html>
